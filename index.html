<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistemas Internos · NEV/USP</title>

<!-- Define o tema antes da renderização (evita "flash" branco) -->
<script>
  (function () {
    try {
      var t = localStorage.getItem('nev-theme');
      if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>

<style>
  /* ============================================================
     VARIÁVEIS DE TEMA
     ============================================================ */
  :root {
    --bg: #eaf0f9;
    --text: #08192e;
    --muted: #5c6c85;
    --accent: #0a2f5a;
    --accent-2: #2f7fe0;
    --accent-3: #62b4ff;

    --glass: rgba(255, 255, 255, 0.62);
    --card: rgba(255, 255, 255, 0.70);
    --card-hover: rgba(255, 255, 255, 0.96);

    --border: rgba(10, 47, 90, 0.10);
    --border-strong: rgba(10, 47, 90, 0.26);

    --ico-bg: linear-gradient(140deg, rgba(47, 127, 224, 0.18), rgba(10, 47, 90, 0.07));
    --ico-fg: #16467e;

    --shadow-lg: 0 30px 70px -28px rgba(10, 47, 90, 0.42);
    --shadow-card: 0 18px 40px -20px rgba(10, 47, 90, 0.45);
    --ring: rgba(47, 127, 224, 0.45);
    --shine: rgba(255, 255, 255, 0.65);
    --mosaic-opacity: 0.17;
  }

  /* Fallback quando o JavaScript está desativado */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #05090f;
      --text: #e9f0fb;
      --muted: #93a3bb;
      --accent: #6fb4ff;
      --accent-2: #3d8bf0;
      --accent-3: #9ccbff;
      --glass: rgba(15, 23, 40, 0.62);
      --card: rgba(255, 255, 255, 0.045);
      --card-hover: rgba(255, 255, 255, 0.085);
      --border: rgba(255, 255, 255, 0.10);
      --border-strong: rgba(111, 180, 255, 0.42);
      --ico-bg: linear-gradient(140deg, rgba(111, 180, 255, 0.20), rgba(111, 180, 255, 0.05));
      --ico-fg: #9ccbff;
      --shadow-lg: 0 30px 80px -30px rgba(0, 0, 0, 0.9);
      --shadow-card: 0 20px 45px -22px rgba(0, 0, 0, 0.85);
      --ring: rgba(111, 180, 255, 0.55);
      --shine: rgba(255, 255, 255, 0.16);
      --mosaic-opacity: 0.10;
    }
  }

  [data-theme="dark"] {
    --bg: #05090f;
    --text: #e9f0fb;
    --muted: #93a3bb;
    --accent: #6fb4ff;
    --accent-2: #3d8bf0;
    --accent-3: #9ccbff;
    --glass: rgba(15, 23, 40, 0.62);
    --card: rgba(255, 255, 255, 0.045);
    --card-hover: rgba(255, 255, 255, 0.085);
    --border: rgba(255, 255, 255, 0.10);
    --border-strong: rgba(111, 180, 255, 0.42);
    --ico-bg: linear-gradient(140deg, rgba(111, 180, 255, 0.20), rgba(111, 180, 255, 0.05));
    --ico-fg: #9ccbff;
    --shadow-lg: 0 30px 80px -30px rgba(0, 0, 0, 0.9);
    --shadow-card: 0 20px 45px -22px rgba(0, 0, 0, 0.85);
    --ring: rgba(111, 180, 255, 0.55);
    --shine: rgba(255, 255, 255, 0.16);
    --mosaic-opacity: 0.10;
  }

  /* ============================================================
     RESET
     ============================================================ */
  *,
  *::before,
  *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html { -webkit-text-size-adjust: 100%; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 32px 20px 80px;
    background: var(--bg);
    color: var(--text);
    font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system,
                 BlinkMacSystemFont, Roboto, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
    transition: background-color .5s ease, color .5s ease;
  }

  /* Mosaico de fundo (imagem institucional) */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url('https://i.imgur.com/O4CzaAr.jpeg');
    background-repeat: repeat;
    background-position: center;
    background-size: 240px auto;
    opacity: var(--mosaic-opacity);
    z-index: -3;
    pointer-events: none;
    transition: opacity .5s ease;
  }

  /* Brilhos suaves animados ao fundo */
  .glow {
    position: fixed;
    inset: 0;
    z-index: -2;
    overflow: hidden;
    pointer-events: none;
  }

  .glow span {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .55;
    will-change: transform;
  }

  .glow span:nth-child(1) {
    width: 46vmax; height: 46vmax;
    top: -16vmax; left: -12vmax;
    background: radial-gradient(circle, var(--accent-2), transparent 65%);
    animation: drift1 22s ease-in-out infinite;
  }

  .glow span:nth-child(2) {
    width: 40vmax; height: 40vmax;
    bottom: -18vmax; right: -10vmax;
    background: radial-gradient(circle, var(--accent-3), transparent 65%);
    animation: drift2 26s ease-in-out infinite;
  }

  .glow span:nth-child(3) {
    width: 30vmax; height: 30vmax;
    top: 40%; left: 55%;
    background: radial-gradient(circle, var(--accent), transparent 65%);
    opacity: .35;
    animation: drift1 30s ease-in-out infinite reverse;
  }

  @keyframes drift1 {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
    50%      { transform: translate3d(6vmax, 4vmax, 0) scale(1.15); }
  }

  @keyframes drift2 {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1.1); }
    50%      { transform: translate3d(-5vmax, -5vmax, 0) scale(1); }
  }

  /* ============================================================
     PAINEL PRINCIPAL
     ============================================================ */
  .panel {
    position: relative;
    width: 100%;
    max-width: 720px;
    padding: 40px 36px 34px;
    border-radius: 30px;
    background: var(--glass);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(26px) saturate(170%);
    -webkit-backdrop-filter: blur(26px) saturate(170%);
    animation: panelIn .8s cubic-bezier(.16, 1, .3, 1) both;
    transition: background-color .5s ease, border-color .5s ease, box-shadow .5s ease;
  }

  /* Borda com degradê luminoso */
  .panel::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(150deg,
                rgba(255, 255, 255, 0.95),
                rgba(98, 180, 255, 0.55) 38%,
                rgba(255, 255, 255, 0.08) 62%,
                rgba(98, 180, 255, 0.35));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
    opacity: .9;
  }

  @keyframes panelIn {
    from { opacity: 0; transform: translateY(26px) scale(.965); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- Cabeçalho ---------- */
  .head {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 30px;
  }

  .badge {
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    width: 56px;
    height: 56px;
    border-radius: 18px;
    color: #fff;
    background: linear-gradient(145deg, var(--accent-2), var(--accent));
    box-shadow: 0 12px 26px -10px var(--ring),
                inset 0 1px 0 rgba(255, 255, 255, 0.45);
    animation: badgePulse 5s ease-in-out infinite;
  }

  .badge svg { width: 26px; height: 26px; }

  @keyframes badgePulse {
    0%, 100% { box-shadow: 0 12px 26px -10px var(--ring), inset 0 1px 0 rgba(255,255,255,.45); }
    50%      { box-shadow: 0 16px 34px -10px var(--ring), inset 0 1px 0 rgba(255,255,255,.45); }
  }

  .titles { flex: 1 1 auto; min-width: 0; }

  h1 {
    font-size: clamp(1.35rem, 3.4vw, 1.62rem);
    font-weight: 800;
    letter-spacing: -0.035em;
    line-height: 1.15;
    background: linear-gradient(115deg, var(--text) 20%, var(--accent-2) 130%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    margin-top: 5px;
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* Relógio */
  .clock {
    flex: 0 0 auto;
    text-align: right;
    line-height: 1.2;
    padding-left: 12px;
    border-left: 1px solid var(--border);
  }

  .clock .time {
    display: block;
    font-size: 1.22rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }

  .clock .date {
    display: block;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 2px;
  }

  /* ---------- Grade de sistemas ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }

  .card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 84px;
    padding: 16px 18px;
    border-radius: 18px;
    background: var(--card);
    border: 1px solid var(--border);
    text-decoration: none;
    color: var(--text);
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: -0.01em;
    line-height: 1.3;
    overflow: hidden;
    isolation: isolate;
    transition: transform .32s cubic-bezier(.16, 1, .3, 1),
                background-color .32s ease,
                border-color .32s ease,
                box-shadow .32s ease,
                color .32s ease;
    animation: cardIn .6s cubic-bezier(.16, 1, .3, 1) both;
  }

  .card:nth-child(1) { animation-delay: .10s; }
  .card:nth-child(2) { animation-delay: .17s; }
  .card:nth-child(3) { animation-delay: .24s; }
  .card:nth-child(4) { animation-delay: .31s; }
  .card:nth-child(5) { animation-delay: .38s; }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: none; }
  }

  /* Último cartão (quantidade ímpar) ocupa a linha inteira */
  .card:last-child:nth-child(odd) {
    grid-column: 1 / -1;
  }

  /* Ícone */
  .ico {
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    border-radius: 13px;
    background: var(--ico-bg);
    color: var(--ico-fg);
    border: 1px solid var(--border);
    transition: transform .38s cubic-bezier(.16, 1, .3, 1),
                background-color .38s ease,
                color .38s ease,
                border-color .38s ease;
  }

  .ico svg {
    width: 21px;
    height: 21px;
    stroke-width: 1.9;
  }

  .label { flex: 1 1 auto; }

  .arrow {
    flex: 0 0 auto;
    width: 18px;
    height: 18px;
    opacity: 0;
    transform: translateX(-8px);
    transition: opacity .3s ease, transform .3s cubic-bezier(.16, 1, .3, 1);
  }

  /* Varredura de brilho */
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(115deg,
                transparent 25%,
                var(--shine) 48%,
                transparent 72%);
    transform: translateX(-130%);
    transition: transform .75s cubic-bezier(.16, 1, .3, 1);
    pointer-events: none;
  }

  .card:hover::before,
  .card:focus-visible::before {
    transform: translateX(130%);
  }

  /* Hover / foco */
  .card:hover,
  .card:focus-visible {
    background: var(--card-hover);
    border-color: var(--border-strong);
    transform: translateY(-4px);
    box-shadow: var(--shadow-card);
    outline: none;
  }

  .card:hover .ico,
  .card:focus-visible .ico {
    transform: scale(1.07) rotate(-5deg);
    color: var(--accent-2);
    border-color: var(--border-strong);
  }

  .card:hover .arrow,
  .card:focus-visible .arrow {
    opacity: 1;
    transform: translateX(0);
    color: var(--accent-2);
  }

  .card:active { transform: translateY(-1px) scale(.995); }

  /* ---------- Botão de tema ---------- */
  .theme-toggle {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 10;
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    cursor: pointer;
    color: var(--text);
    background: var(--glass);
    border: 1px solid var(--border);
    box-shadow: 0 10px 24px -14px rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transition: transform .28s cubic-bezier(.16, 1, .3, 1),
                background-color .3s ease, border-color .3s ease;
  }

  .theme-toggle:hover {
    transform: translateY(-2px) rotate(12deg);
    border-color: var(--border-strong);
  }

  .theme-toggle svg { width: 19px; height: 19px; }
  .theme-toggle .sun  { display: none; }
  [data-theme="dark"] .theme-toggle .sun  { display: block; }
  [data-theme="dark"] .theme-toggle .moon { display: none; }

  /* ---------- Assinatura ---------- */
  .credits {
    position: fixed;
    bottom: 18px;
    right: 20px;
    z-index: 10;
    padding: 7px 15px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--muted);
    background: var(--glass);
    border: 1px solid var(--border);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    opacity: .42;
    cursor: default;
    user-select: none;
    transition: opacity .35s ease, transform .35s ease,
                color .35s ease, border-color .35s ease, box-shadow .35s ease;
  }

  .credits:hover {
    opacity: 1;
    color: var(--text);
    border-color: var(--border-strong);
    transform: translateY(-3px);
    box-shadow: 0 14px 30px -16px rgba(0, 0, 0, 0.55);
  }

  /* ============================================================
     RESPONSIVO
     ============================================================ */
  @media (max-width: 620px) {
    body { padding: 24px 14px 78px; }

    .panel { padding: 28px 20px 24px; border-radius: 24px; }

    .head { gap: 13px; margin-bottom: 24px; flex-wrap: wrap; }

    .badge { width: 48px; height: 48px; border-radius: 15px; }
    .badge svg { width: 22px; height: 22px; }

    .clock {
      order: 3;
      flex-basis: 100%;
      text-align: left;
      border-left: none;
      padding: 10px 0 0;
      border-top: 1px solid var(--border);
      margin-top: 4px;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .clock .time { font-size: 1rem; }

    .grid { grid-template-columns: 1fr; gap: 11px; }

    .card:last-child:nth-child(odd) { grid-column: auto; }

    .card { min-height: 76px; padding: 14px 16px; font-size: .92rem; }

    body::before { background-size: 170px auto; }

    .theme-toggle { top: 12px; right: 12px; width: 40px; height: 40px; }

    .credits { font-size: .72rem; bottom: 12px; right: 12px; padding: 6px 12px; }
  }

  /* ============================================================
     ACESSIBILIDADE / MOVIMENTO REDUZIDO
     ============================================================ */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }
</style>
</head>

  </main>

  <!-- Assinatura -->
  <div class="credits">Desenvolvido por Emerson Fragoso</div>

  <script>
    /* ---------- Relógio ---------- */
    (function () {
      var timeEl = document.getElementById('clockTime');
      var dateEl = document.getElementById('clockDate');
      if (!timeEl || !dateEl) return;

      function tick() {
        var now = new Date();
        timeEl.textContent = now.toLocaleTimeString('pt-BR', {
          hour: '2-digit', minute: '2-digit'
        });
        var d = now.toLocaleDateString('pt-BR', {
          weekday: 'short', day: '2-digit', month: 'short'
        });
        dateEl.textContent = d.replace(/\./g, '');
      }

      tick();
      setInterval(tick, 10000);
    })();

    /* ---------- Alternador de tema ---------- */
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById('themeToggle');
      if (!btn) return;

      btn.addEventListener('click', function () {
        var current = root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        var next = current === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('nev-theme', next); } catch (e) {}
      });
    })();
  </script>

</body>
